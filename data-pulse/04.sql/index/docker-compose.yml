services:
  movies:
    image: postgres:16
    container_name: movies_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./1.schema.sql:/docker-entrypoint-initdb.d/1.schema.sql:ro
      - ./2.inser-data.sql:/docker-entrypoint-initdb.d/2.inser-data.sql:ro

volumes:
  movies_data:
